name: sdlc-h10

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bistro}
      POSTGRES_USER: ${POSTGRES_USER:-bistro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env.compose.local con npm start}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT:-55440}:5432'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bistro}:${POSTGRES_PASSWORD:?Configure .env.compose.local con npm start}@db:5432/${POSTGRES_DB:-bistro}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-bistro}:${POSTGRES_PASSWORD:?Configure .env.compose.local con npm start}@db:5432/${POSTGRES_DB:-bistro}?schema=public
      PORT: 3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    profiles: ["frontend"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
