name: pasta-la-vista
services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure la conexión TLS de Supabase}
      DIRECT_URL: ${DIRECT_URL:?Configure la conexión directa o Session pooler para migraciones}
      LOCAL_ACCESS_KEY: ${LOCAL_ACCESS_KEY:?Configure una clave hexadecimal de 64 caracteres}
      LOCAL_ACCESS_VERSION: '2'
      PORT: '3000'
      PUBLIC_API_URL: https://${API_DOMAIN:?Configure el dominio público de la API}/api
      COOKIE_SECURE: 'true'
      DISABLE_LEGACY_DEMO: 'true'
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    command: [sh, -c, 'node scripts/validate-production.cjs && ../node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && node prisma/bootstrap.cjs && exec node dist/main.js']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Configure el dominio público de la API}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
