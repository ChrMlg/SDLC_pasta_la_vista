name: pasta-la-vista
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bistro
      POSTGRES_USER: bistro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure la contraseña privada}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bistro -d bistro']
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bistro:${POSTGRES_PASSWORD:?Configure la contraseña privada}@db:5432/bistro?schema=public
      DIRECT_URL: postgresql://bistro:${POSTGRES_PASSWORD:?Configure la contraseña privada}@db:5432/bistro?schema=public
      LOCAL_ACCESS_KEY: ${LOCAL_ACCESS_KEY:?Configure una clave hexadecimal de 64 caracteres}
      LOCAL_ACCESS_VERSION: '2'
      PORT: '3000'
      PUBLIC_API_URL: https://${API_DOMAIN:?Configure el dominio público de la API}/api
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Configure el dominio público de la API}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
